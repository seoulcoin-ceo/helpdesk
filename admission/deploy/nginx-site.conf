# /etc/nginx/sites-available/ipsi.isjung.com
# install.sh 가 __DOMAIN__ 을 실제 주소(기본 ipsi.isjung.com)로 바꿔 설치합니다.
# Cloudflare(터널 또는 프록시)가 HTTPS 를 처리하므로 서버는 80 포트만 엽니다.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/__DOMAIN__;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
}
