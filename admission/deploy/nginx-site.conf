# /etc/nginx/sites-available/ipsi.isjung.com  (install.sh 가 __DOMAIN__ 을 실제 주소로 바꿔 설치)
# 방문자는 항상 HTTPS 로만 접속:
#   - Cloudflare 가 방문자 구간 HTTPS 를 처리하고, http 로 들어온 요청은 아래에서 https 로 이동시킨다.
#   - TLS_CERT 를 지정해 설치하면 서버도 443(HTTPS)으로 직접 응답한다(Cloudflare 원본 인증서, Full(strict)).

map $http_x_forwarded_proto $ipsi_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    #__TLS_LISTEN__

    root /var/www/__DOMAIN__;
    index index.html;
    charset utf-8;

    # Cloudflare 를 거쳐 http 로 들어온 방문자는 https 로 이동
    if ($ipsi_proto = "http") { return 301 https://$host$request_uri; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
}
