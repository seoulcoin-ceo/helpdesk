# /etc/nginx/sites-available/ipsi.isjung.com  (install.sh 가 __DOMAIN__/__LISTEN__ 을 바꿔 설치)
# 서버(sc-kdb)의 80 포트는 기존 kdb 사이트용이므로 쓰지 않는다.
# 입시 사이트는 localhost:8500 에서만 응답하고, Cloudflare 터널(cloudflared)이
# https://ipsi.isjung.com → http://localhost:8500 으로 연결한다. HTTPS 는 Cloudflare 가 처리.

map $http_x_forwarded_proto $ipsi_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen __LISTEN__ default_server;
    server_name __DOMAIN__ localhost;

    root /var/www/__DOMAIN__;
    index index.html;
    charset utf-8;

    # Cloudflare 를 거쳐 http 로 들어온 방문자는 https 로 이동
    if ($ipsi_proto = "http") { return 301 https://__DOMAIN__$request_uri; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
}
