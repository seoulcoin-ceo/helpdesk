# /etc/nginx/sites-available/isjung.com
# install.sh 가 자동으로 설치합니다. HTTPS(443) 설정은 certbot 이 이 파일에 추가합니다.
server {
    listen 80;
    listen [::]:80;
    server_name isjung.com www.isjung.com;

    root /var/www/isjung.com;
    index index.html;
    charset utf-8;

    # www → 루트 도메인 통일
    if ($host = www.isjung.com) { return 301 $scheme://isjung.com$request_uri; }

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 압축 (data/*.json 전송량 1/5 이하로 감소)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 공시 데이터: 1시간 캐시 (월 1회 갱신)
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSS/JS 는 ?v= 버전 파라미터로 갱신하므로 길게 캐시
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 숨김 파일 차단
    location ~ /\. { deny all; }
}
