<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none"><rect width="900" height="560" rx="40" fill="#F4F8FF"/><rect x="87" y="72" width="726" height="416" rx="36" fill="#0B2D59"/><rect x="128" y="115" width="330" height="160" rx="26" fill="#FFFFFF"/><text x="162" y="170" fill="#071B38" font-size="28" font-family="Arial" font-weight="700">환자 문의</text><text x="162" y="212" fill="#60708A" font-size="20" font-family="Arial">보험이 되나요? 서류는 뭔가요?</text><rect x="511" y="115" width="258" height="160" rx="26" fill="#FFFFFF"/><text x="544" y="170" fill="#071B38" font-size="28" font-family="Arial" font-weight="700">보험청구 안내 데스크</text><text x="544" y="212" fill="#60708A" font-size="20" font-family="Arial">절차 안내 · 서류 체크</text><path d="M469 196H499" stroke="#22C7B8" stroke-width="12" stroke-linecap="round"/><path d="M485 180L505 197L485 214" stroke="#22C7B8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="128" y="322" width="641" height="114" rx="24" fill="#FFFFFF"/><text x="160" y="372" fill="#FF6B3D" font-size="24" font-family="Arial" font-weight="700">운영 원칙</text><text x="160" y="413" fill="#071B38" font-size="30" font-family="Arial" font-weight="800">도와주되 확정하지 않는 안내 구조</text></svg>